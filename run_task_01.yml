---
# run_task_01.yml
# Tarea 0.1
- name: "Tarea 0.1 Bizagi"
  hosts: servers_prod
  gather_facts: false

  pre_tasks:
    - name: Recuperar Facts
      ansible.builtin.setup:
      ignore_unreachable: true
      register: fact_result
      retries: 3
      delay: 5
      until: not fact_result.unreachable | default(false)

    - name: Establecer estado de los Facts
      ansible.builtin.set_fact:
        facts_generated: true
      when: ansible_os_family is defined

    - name: Crear resultado si es No alcanzable
      when: facts_generated is not defined
      block:
        - name: Registrar error de recoleccion de Facts
          ansible.builtin.set_fact:
            connectivity_result:
              start_time: "{{ ansible_date_time.date | default('N/A') }} - {{ ansible_date_time.time | default('N/A') }}"
              task_id: "0.1"
              source_host: "{{ inventory_hostname }}"
              results: ["{{ inventory_hostname }} = UNREACHABLE"]
              status: "unreachable"

  tasks:
    - name: "Ejecutar Tarea 0.1 - DataPower Connectivity"
      ansible.builtin.include_role:
        name: connectivity_check
      vars:
        connectivity_check_check_type: "telnet"
        connectivity_check_target_hosts: ["192.168.20.85"]
        connectivity_check_ports: [22]
        connectivity_check_task_id: "0.1"
        connectivity_check_task_description: "Conectividad DataPower Bus Services"
        connectivity_check_show_details: true
      when: facts_generated is defined

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg: |
          Tarea {{ connectivity_result.task_id }} completada:
          - Hora: {{ connectivity_result.start_time }}
          - Host: {{ connectivity_result.source_host }}
          - Status: {{ connectivity_result.status }}
          - Results: {{ connectivity_result.results }}

  post_tasks:
    - name: "Registrar resultados globales en AWX"
      ansible.builtin.set_stats:
        data:
          bizagi_task_01_summary:
            task_id: "0.1"
            task_description: "Conectividad DataPower Bus Services"
            execution_time: "{{ ansible_date_time.iso8601 }}"
            target: "192.168.20.85:22"
            total_hosts: "{{ groups['servers_prod'] | length }}"
            results: |
              [
              {% for host in groups['servers_prod'] %}
                {
                  "host": "{{ host }}",
                  "status": "{{ hostvars[host]['connectivity_result']['status'] }}",
                  "details": {{ hostvars[host]['connectivity_result']['results'] | to_json }}
                }{% if not loop.last %},{% endif %}
              {% endfor %}
              ]
        per_host: false
      run_once: true
      delegate_to: localhost
