---
# tasks file for roles/test_connection
- name: "Mostrar configuración de la prueba Telnet"
  ansible.builtin.debug:
    msg:
      - "===================================="
      - "TAREA {{ test_connection_task_id }}: {{ test_connection_task_description }}"
      - "===================================="
      - "Desde: {{ inventory_hostname }}"
      - "Tipo: {{ test_connection_check_type }}"
      - "Destinos: {{ test_connection_target_hosts | join(', ') }}"
      - "Puertos: {{ test_connection_ports | default(['N/A']) | join(', ') }}"
      - "===================================="
  when: test_connection_check_type == 'telnet'

- name: "Mostrar configuración de la prueba Ping"
  ansible.builtin.debug:
    msg:
      - "===================================="
      - "TAREA {{ test_connection_task_id }}: {{ test_connection_task_description }}"
      - "===================================="
      - "Desde: {{ inventory_hostname }}"
      - "Tipo: {{ test_connection_check_type }}"
      - "Destinos: {{ test_connection_target_hosts | join(', ') }}"
      - "===================================="
  when: test_connection_check_type == 'ping'

- name: Ejecutar Test Windows
  ansible.builtin.include_tasks:
    file: windows.yml
  when: ansible_os_family == 'Windows'

- name: Ejecutar Test Linux
  ansible.builtin.include_tasks:
    file: linux.yml
  when: ansible_os_family in ['RedHat', 'Debian']
