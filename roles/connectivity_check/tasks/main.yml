---
# tasks file for roles/connectivity_check
- name: (FAIL) - Validar parámetros requeridos
  ansible.builtin.fail:
    msg: "Parámetro requerido faltante: {{ item }}"
  when: vars[item] is not defined or vars[item] | length == 0
  loop:
    - connectivity_check_target_hosts
    - connectivity_check_check_type

- name: (FAIL) - Validar puertos para telnet
  ansible.builtin.fail:
    msg: "Puertos requeridos para check_type telnet"
  when: connectivity_check_check_type in ['telnet', 'telnet_bidirectional']
    and (connectivity_check_ports is not defined or connectivity_check_ports | length == 0)

- name: Mostrar configuración de la prueba
  ansible.builtin.debug:
    msg: |
      ====================================
      TAREA {{ connectivity_check_task_id }}: {{ connectivity_check_task_description }}
      ====================================
      Desde: {{ inventory_hostname }}
      Tipo: {{ connectivity_check_check_type }}
      Destinos: {{ connectivity_check_target_hosts | join(', ') }}
      Puertos: {{ connectivity_check_ports | default(['N/A']) | join(', ') }}
      ====================================

- name: Ejecutar test de conectividad
  block:
    - name: Test conectividad con Test-NetConnection
      ansible.windows.win_shell: |
        {% for host in connectivity_check_target_hosts %}
        {% for port in connectivity_check_ports %}
        $result = Test-NetConnection -ComputerName "{{ host }}" -Port {{ port }} -InformationLevel Quiet -WarningAction SilentlyContinue
        if ($result) {
            Write-Host "{{ host }}:{{ port }} = SUCCESS"
        } else {
            Write-Host "{{ host }}:{{ port }} = FAILED"
        }
        {% endfor %}
        {% endfor %}
      register: connectivity_test
      retries: "{{ connectivity_check_retries }}"
      delay: "{{ connectivity_check_retry_delay }}"
      until: connectivity_test is defined
      changed_when: false

  rescue:
    - name: Manejar error (WinRM, PowerShell, etc.)
      ansible.builtin.set_fact:
        connectivity_test:
          stdout_lines:
            [
              "SYSTEM_ERROR: {{ ansible_failed_result.msg | default('Error técnico') }}",
            ]
          stdout: "SYSTEM_ERROR"

    - name: Mostrar error capturado
      ansible.builtin.debug:
        msg: |
          ERROR TÉCNICO CAPTURADO:
          {{ ansible_failed_result.msg | default('Error desconocido') }}
          El test no pudo ejecutarse por problemas.

- name: Crear resultado
  ansible.builtin.set_fact:
    connectivity_result:
      start_time: "{{ ansible_date_time.date }} - {{ ansible_date_time.time }}"
      task_id: "{{ connectivity_check_task_id }}"
      source_host: "{{ inventory_hostname }}"
      results: "{{ connectivity_test.stdout_lines }}"
      status: "{{ 'success' if 'FAILED' not in connectivity_test.stdout else 'failed' }}"
