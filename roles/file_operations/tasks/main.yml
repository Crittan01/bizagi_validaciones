# roles/file_operations/tasks/main.yml

- name: "(FAIL) - Validar parámetros requeridos"
  ansible.builtin.fail:
    msg: "Parámetro requerido faltante: {{ item }}"
  when: vars[item] is not defined or vars[item] | length == 0
  loop:
    - file_operations_source_path
    - file_operations_operation_type

- name: "Mostrar configuración de la operación"
  ansible.builtin.debug:
    msg: |
      ====================================
      TAREA {{ file_operations_task_id }}: {{ file_operations_task_description }}
      ====================================
      Servidor: {{ inventory_hostname }}
      Operación: {{ file_operations_operation_type }}
      Ruta: {{ file_operations_source_path }}
      Patrones: {{ file_operations_file_patterns | join(', ') }}
      ====================================

- name: "Ejecutar inventario de archivos"
  block:
    - name: "Verificar que la ruta existe"
      ansible.windows.win_stat:
        path: "{{ file_operations_source_path }}"
      register: path_check

    - name: "Obtener lista de archivos por patrón"
      ansible.windows.win_find:
        paths: "{{ file_operations_source_path }}"
        patterns: "{{ file_operations_file_patterns }}"
        file_type: file
        get_checksum: true
        checksum_algorithm: md5
      register: found_files
      when: path_check.stat.exists

  rescue:
    - name: "Manejar error en inventario"
      ansible.builtin.set_fact:
        found_files:
          files: []
        path_check:
          stat:
            exists: false

- name: "Procesar inventario de archivos"
  ansible.builtin.set_fact:
    files_inventory: |
      {%- set files = [] -%}
      {%- for file in found_files.files | default([]) -%}
        {%- set file_info = {
          'name': file.filename,
          'full_path': file.path,
          'lastwritetime': file.lastwritetime,
          'size': file.size,
          'hash': file.checksum,
          'extension': file.extension | default('')
        } -%}
        {%- set _ = files.append(file_info) -%}
      {%- endfor -%}
      {{ files }}

- name: "Crear resultado de la operación"
  ansible.builtin.set_fact:
    file_operations_result:
      start_time: "{{ ansible_date_time.date }} - {{ ansible_date_time.time }}"
      task_id: "{{ file_operations_task_id }}"
      source_host: "{{ inventory_hostname }}"
      operation: "{{ file_operations_operation_type }}"
      source_path: "{{ file_operations_source_path }}"
      path_exists: "{{ path_check.stat.exists | default(false) }}"
      files_found: "{{ files_inventory | length }}"
      files_inventory: "{{ files_inventory }}"
      status: "{{ 'success' if path_check.stat.exists else 'failed' }}"

- name: "Mostrar archivos encontrados"
  ansible.builtin.debug:
    msg: |
      📁 Archivos encontrados en {{ inventory_hostname }}:
      {% if files_inventory | length > 0 %}
      {% for file in files_inventory %}
      📄 {{ file.name }} | Timestamp: {{ file.lastwritetime }} | {{ file.size }} bytes | {{ file.extension }}
      {% endfor %}
      {% else %}
        No se encontraron archivos con los patrones especificados
      {% endif %}
      Total: {{ files_inventory | length }} archivos
  when: file_operations_show_details | default(true)

- name: "Crear resultado del host actual"
  ansible.builtin.set_fact:
    host_result:
      status: "{{ file_operations_result.status }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      operation: "{{ file_operations_operation_type }}"
      files_count: "{{ files_inventory | length }}"
      files_inventory: "{{ files_inventory }}"
      path_exists: "{{ path_check.stat.exists | default(false) }}"

- name: "Preparar datos de la task"
  ansible.builtin.set_fact:
    task_key: "bizagi_task_{{ file_operations_task_id }}"
    task_info:
      task_id: "{{ file_operations_task_id }}"
      description: "{{ file_operations_task_description }}"
      operation: "{{ file_operations_operation_type }}"
      target_path: "{{ file_operations_source_path }}"
      execution_time: "{{ ansible_date_time.iso8601 }}"

- name: "Agregar host a resultados de la task"
  ansible.builtin.set_stats:
    data:
      "{{ task_key }}": "{{ current_task_data | combine({'hosts': updated_hosts}) }}"
    per_host: false
  vars:
    current_task_data: "{{ vars[task_key] | default({'task_info': task_info, 'hosts': {}}) }}"
    updated_hosts: "{{ current_task_data.hosts | default({}) | combine({inventory_hostname: host_result}) }}"
