---
# tasks file for roles/telnet_check
- name: "(FAIL) - Validar parámetros requeridos"
  ansible.builtin.fail:
    msg: "Parámetro requerido faltante: {{ item }}"
  when: vars[item] is not defined or vars[item] | length == 0
  loop:
    - telnet_check_target_hosts
    - telnet_check_check_type

- name: "(FAIL) - Validar puertos para telnet"
  ansible.builtin.fail:
    msg: "Puertos requeridos para check_type telnet"
  when: telnet_check_check_type in ['telnet']
    and (telnet_check_ports is not defined or telnet_check_ports | length == 0)

- name: "Mostrar configuración de la prueba"
  ansible.builtin.debug:
    msg:
      - "===================================="
      - "TAREA {{ telnet_check_task_id }}: {{ telnet_check_task_description }}"
      - "===================================="
      - "Desde: {{ inventory_hostname }}"
      - "Tipo: {{ telnet_check_check_type }}"
      - "Destinos: {{ telnet_check_target_hosts | join(', ') }}"
      - "Puertos: {{ telnet_check_ports | default(['N/A']) | join(', ') }}"
      - "===================================="

- name: "Ejecutar test de conectividad"
  block:
    - name: "Test conectividad con Test-NetConnection"
      ansible.windows.win_shell: "{{ lookup('template', 'telnet_check.ps1.j2') }}"
      register: connectivity_test
      retries: "{{ telnet_check_retries }}"
      delay: "{{ telnet_check_retry_delay }}"
      until: connectivity_test is defined
      changed_when: false

  rescue:
    - name: "Manejar error (WinRM, PowerShell, etc.)"
      ansible.builtin.set_fact:
        connectivity_test:
          stdout_lines:
            [
              "SYSTEM_ERROR: {{ ansible_failed_result.msg | default('Error técnico') }}",
            ]
          stdout: "SYSTEM_ERROR"

    - name: "Mostrar error capturado"
      ansible.builtin.debug:
        msg: |
          ERROR TÉCNICO CAPTURADO:
          {{ ansible_failed_result.msg | default('Error desconocido') }}
          El test no pudo ejecutarse por problemas.

# Procesar datos del Test
- name: "Crear resultado"
  ansible.builtin.set_fact:
    connectivity_result:
      start_time: "{{ ansible_date_time.date }} - {{ ansible_date_time.time }}"
      task_id: "{{ telnet_check_task_id }}"
      source_host: "{{ inventory_hostname }}"
      results: "{{ connectivity_test.stdout_lines }}"
      status: "{{ 'success' if 'FAILED' not in connectivity_test.stdout else 'failed' }}"

# Formatear para stats
- name: "Crear resultado del host actual"
  ansible.builtin.set_fact:
    host_result:
      status: "{{ connectivity_result.status }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      details: "{{ connectivity_result.results }}"

# Metadata de la task
- name: "Preparar datos de la task"
  ansible.builtin.set_fact:
    task_key: "bizagi_task_{{ telnet_check_task_id }}"
    task_info:
      task_id: "{{ telnet_check_task_id }}"
      description: "{{ telnet_check_task_description }}"
      target: "{{ telnet_check_target_hosts | join(',') }}:{{ telnet_check_ports | join(',') }}"
      execution_time: "{{ ansible_date_time.iso8601 }}"

# Registrar en AWX (set_stats)
- name: "Agregar host a resultados de la task"
  ansible.builtin.set_stats:
    data:
      "{{ task_key }}": "{{ current_task_data | combine({'hosts': updated_hosts}) }}"
    per_host: false
  vars:
    current_task_data: "{{ vars[task_key] | default({'task_info': task_info, 'hosts': {}}) }}"
    updated_hosts: "{{ current_task_data.hosts | default({}) | combine({inventory_hostname: host_result}) }}"
