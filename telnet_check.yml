---
# telnet_check.yml
- name: "Playbook - Prueba Conectividad Telnet"
  hosts: all_servers
  gather_facts: false

  vars:
    # variables a nivel playbook
    task_targets: "{{ (task_targets_input | default('')) | split('\n') | list }}"
    task_ports: "{{ (task_ports_input | default('')) | split('\n') | list }}"
    task_id: "{{ custom_task_id | default('Conexion') }}"
    task_description: "Prueba Conectividad Telnet/Ping"

  pre_tasks:
    - name: "Recuperar Facts"
      ansible.builtin.setup:
      ignore_unreachable: true
      register: fact_result
      retries: 3
      delay: 5
      until: not fact_result.unreachable | default(false)

    - name: "Establecer estado de los Facts"
      ansible.builtin.set_fact:
        facts_generated: true
      when: ansible_os_family is defined

    - name: "Crear resultado si es No alcanzable"
      when: facts_generated is not defined
      block:
        - name: "Registrar error de recoleccion de Facts"
          ansible.builtin.set_fact:
            connectivity_result:
              start_time: "{{ ansible_date_time.date | default('N/A') }} - {{ ansible_date_time.time | default('N/A') }}"
              task_id: "{{ task_id }}"
              source_host: "{{ inventory_hostname }}"
              results: ["{{ inventory_hostname }} = UNREACHABLE"]
              status: "unreachable"

  tasks:
    - name: "Validar si hay targets configurados"
      ansible.builtin.debug:
        msg:
          - "Targets: {{ task_targets | length }} configurados"
          - "Puertos: {{ task_ports | length }} configurados"

    - name: "Ejecutar Tarea - {{ task_description }}"
      ansible.builtin.include_role:
        name: telnet_check
      vars:
        telnet_check_check_type: "telnet"
        telnet_check_target_hosts: "{{ task_targets }}"
        telnet_check_ports: "{{ task_ports }}"
        telnet_check_task_id: "{{ task_id }}"
        telnet_check_task_description: "{{ task_description }}"
        telnet_check_show_details: true
      when:
        - facts_generated is defined

    - name: "CLICK: Mostrar resultado"
      ansible.builtin.debug:
        msg:
          - "===================================="
          - "TAREA {{ connectivity_result.task_id }} completada:"
          - "===================================="
          - "Hora: {{ connectivity_result.start_time }}"
          - "Host: {{ connectivity_result.source_host }}"
          - "Status: {{ connectivity_result.status }}"
          - "Results: {{ connectivity_result.results }}"
          - "===================================="
