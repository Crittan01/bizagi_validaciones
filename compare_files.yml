---
# Play 1: Inicialización y validación desde localhost
- name: "Inicialización de comparación de archivos"
  hosts: localhost
  gather_facts: true

  vars:
    file_comparison_task_id: "{{ custom_file_comparison_task_id | default('compara') }}"
    file_comparison_task_description: "{{ custom_file_comparison_task_description | default('Validacion de Archivos') }}"

  tasks:
    - name: "Mostrar información inicial"
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════"
          - "INICIANDO COMPARACIÓN DE ARCHIVOS"
          - "════════════════════════════════════════════"
          - "Task ID: {{ file_comparison_task_id }}"
          - "Descripción: {{ file_comparison_task_description }}"
          - "Timestamp: {{ ansible_date_time.iso8601 }}"
          - "════════════════════════════════════════════"
      tags: always

    - name: "Validar grupos en inventario"
      ansible.builtin.assert:
        that:
          - groups['servers_produccion'] is defined
          - groups['servers_contingencia'] is defined
          - groups['servers_produccion'] | length > 0
          - groups['servers_contingencia'] | length > 0
        fail_msg: "ERROR: Los grupos servers_produccion y/o servers_contingencia no están definidos"
        success_msg: "✓ Grupos validados correctamente"
      tags: validation

    - name: "Establecer variables globales"
      ansible.builtin.set_fact:
        comparison_config:
          task_id: "{{ file_comparison_task_id }}"
          task_description: "{{ file_comparison_task_description }}"
          source_group: "servers_produccion"
          target_group: "servers_contingencia"
          comparison_path: "{{ file_comparison_default_comparison_path | default('D:\\Mis Documentos') }}"
          file_patterns: "{{ file_comparison_file_patterns | default(['*.bat', '*.ps1']) }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
      tags: always

# Play 2: Validación de conectividad en servidores de producción
- name: "Validar servidores de producción"
  hosts: servers_produccion
  gather_facts: false

  tasks:
    - name: "Verificar conectividad"
      ansible.windows.win_ping:
      tags: validation

    - name: "Validar existencia de ruta"
      ansible.windows.win_stat:
        path: "{{ hostvars['localhost']['comparison_config']['comparison_path'] }}"
      register: prod_path_check
      tags: validation

    - name: "Verificar ruta"
      ansible.builtin.assert:
        that:
          - prod_path_check.stat.exists
          - prod_path_check.stat.isdir
        fail_msg: "ERROR: La ruta no existe en {{ inventory_hostname }}"
        success_msg: "✓ Ruta validada en {{ inventory_hostname }}"
      tags: validation

# Play 3: Validación de conectividad en servidores de contingencia
- name: "Validar servidores de contingencia"
  hosts: servers_contingencia
  gather_facts: false

  tasks:
    - name: "Verificar conectividad"
      ansible.windows.win_ping:
      tags: validation

    - name: "Validar existencia de ruta"
      ansible.windows.win_stat:
        path: "{{ hostvars['localhost']['comparison_config']['comparison_path'] }}"
      register: cont_path_check
      tags: validation

    - name: "Verificar ruta"
      ansible.builtin.assert:
        that:
          - cont_path_check.stat.exists
          - cont_path_check.stat.isdir
        fail_msg: "ERROR: La ruta no existe en {{ inventory_hostname }}"
        success_msg: "✓ Ruta validada en {{ inventory_hostname }}"
      tags: validation

# Play 4: Recolección de archivos de producción
- name: "Recolectar archivos de producción"
  hosts: servers_produccion
  gather_facts: false

  tasks:
    - name: "Buscar archivos en producción"
      ansible.windows.win_find:
        paths: "{{ hostvars['localhost']['comparison_config']['comparison_path'] }}"
        patterns: "{{ hostvars['localhost']['comparison_config']['file_patterns'] }}"
        recurse: false
      register: prod_files_raw
      tags: collection

    - name: "Procesar archivos encontrados"
      ansible.builtin.set_fact:
        prod_files_dict: >-
          {%- set files = {} -%}
          {%- for file in prod_files_raw.files -%}
            {%- set _ = files.update({
              file.path | win_basename: {
                'path': file.path,
                'size': file.size,
                'checksum': file.checksum | default('N/A'),
                'lastwritetime': file.lastwritetime,
                'server': inventory_hostname,
                'server_type': 'produccion'
              }
            }) -%}
          {%- endfor -%}
          {{ files }}
      tags: collection

    - name: "Compartir archivos de producción"
      ansible.builtin.set_fact:
        all_prod_files: "{{ prod_files_dict }}"
        prod_file_count: "{{ prod_files_dict | length }}"
      delegate_to: localhost
      delegate_facts: true
      tags: collection

# Play 5: Recolección de archivos de contingencia
- name: "Recolectar archivos de contingencia"
  hosts: servers_contingencia
  gather_facts: false

  tasks:
    - name: "Buscar archivos en contingencia"
      ansible.windows.win_find:
        paths: "{{ hostvars['localhost']['comparison_config']['comparison_path'] }}"
        patterns: "{{ hostvars['localhost']['comparison_config']['file_patterns'] }}"
        recurse: false
      register: cont_files_raw
      tags: collection

    - name: "Procesar archivos encontrados"
      ansible.builtin.set_fact:
        cont_files_dict: >-
          {%- set files = {} -%}
          {%- for file in cont_files_raw.files -%}
            {%- set _ = files.update({
              file.path | win_basename: {
                'path': file.path,
                'size': file.size,
                'checksum': file.checksum | default('N/A'),
                'lastwritetime': file.lastwritetime,
                'server': inventory_hostname,
                'server_type': 'contingencia'
              }
            }) -%}
          {%- endfor -%}
          {{ files }}
      tags: collection

    - name: "Compartir archivos de contingencia"
      ansible.builtin.set_fact:
        all_cont_files: "{{ cont_files_dict }}"
        cont_file_count: "{{ cont_files_dict | length }}"
      delegate_to: localhost
      delegate_facts: true
      tags: collection

# Play 6: Comparación y generación de reporte en localhost
- name: "Comparar archivos y generar reporte"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: "Mostrar resumen de archivos encontrados"
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════"
          - "RESUMEN DE ARCHIVOS ENCONTRADOS"
          - "════════════════════════════════════════════"
          - "Producción: {{ prod_file_count }} archivos"
          - "Contingencia: {{ cont_file_count }} archivos"
          - "════════════════════════════════════════════"
      tags: comparison

    - name: "Identificar archivos faltantes"
      ansible.builtin.set_fact:
        missing_files: >-
          {%- set missing = [] -%}
          {%- for file, details in all_prod_files.items() -%}
            {%- if file not in all_cont_files -%}
              {%- set _ = missing.append({'name': file, 'details': details}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ missing }}
      tags: comparison

    - name: "Identificar archivos desactualizados"
      ansible.builtin.set_fact:
        outdated_files: >-
          {%- set outdated = [] -%}
          {%- for file, prod_details in all_prod_files.items() -%}
            {%- if file in all_cont_files -%}
              {%- set cont_details = all_cont_files[file] -%}
              {%- if prod_details.lastwritetime > cont_details.lastwritetime -%}
                {%- set _ = outdated.append({
                  'name': file,
                  'source': prod_details,
                  'target': cont_details
                }) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ outdated }}
      tags: comparison

    - name: "Identificar archivos idénticos"
      ansible.builtin.set_fact:
        identical_files: >-
          {%- set identical = [] -%}
          {%- for file, prod_details in all_prod_files.items() -%}
            {%- if file in all_cont_files -%}
              {%- set cont_details = all_cont_files[file] -%}
              {%- if prod_details.checksum == cont_details.checksum -%}
                {%- set _ = identical.append(file) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ identical }}
      tags: comparison

    - name: "Crear resumen de comparación"
      ansible.builtin.set_fact:
        comparison_summary:
          task_id: "{{ comparison_config.task_id }}"
          task_description: "{{ comparison_config.task_description }}"
          total_source_files: "{{ all_prod_files | length }}"
          total_target_files: "{{ all_cont_files | length }}"
          missing_count: "{{ missing_files | length }}"
          outdated_count: "{{ outdated_files | length }}"
          identical_count: "{{ identical_files | length }}"
          missing_files: "{{ missing_files }}"
          outdated_files: "{{ outdated_files }}"
          status: "{{ 'OK' if (missing_files | length == 0 and outdated_files | length == 0) else 'WARNING' }}"
          timestamp: "{{ comparison_config.timestamp }}"
      tags: comparison

    - name: "Mostrar reporte visual"
      ansible.builtin.debug:
        msg:
          - "╔═══════════════════════════════════════════════════════════════"
          - "║           REPORTE DE COMPARACIÓN DE ARCHIVOS                  "
          - "╠═══════════════════════════════════════════════════════════════"
          - "║ Task: {{ comparison_summary.task_description }}"
          - "║ ID: {{ comparison_summary.task_id }}"
          - "║ Fecha: {{ comparison_summary.timestamp }}"
          - "╠═══════════════════════════════════════════════════════════════"
          - "║ RESUMEN DE RESULTADOS:"
          - "║ Total archivos en producción:    {{ comparison_summary.total_source_files }}"
          - "║"
          - "║ Total archivos en contingencia:  {{ comparison_summary.total_target_files }}"
          - "║ Archivos faltantes:              {{ comparison_summary.missing_count }}"
          - "║ Archivos desactualizados:        {{ comparison_summary.outdated_count }}"
          - "║ Archivos idénticos:              {{ comparison_summary.identical_count }}"
          - "╠═══════════════════════════════════════════════════════════════"
          - "║ ESTADO: {{ comparison_summary.status }}"
          - "╚═══════════════════════════════════════════════════════════════"
      tags: report

    - name: "Mostrar archivos faltantes"
      ansible.builtin.debug:
        msg:
          - "═════════════════════════════════════════"
          - "ARCHIVOS FALTANTES EN CONTINGENCIA:"
          - "═════════════════════════════════════════"
          - "{% for file in missing_files %}{{ file.name }} ({{ file.details.size }} bytes){% endfor %}"
      when: missing_files | length > 0
      tags: report

    - name: "Mostrar archivos desactualizados"
      ansible.builtin.debug:
        msg:
          - "═════════════════════════════════════════"
          - "ARCHIVOS DESACTUALIZADOS:"
          - "═════════════════════════════════════════"
          - "{% for file in outdated_files %}{{ file.name }} - Más reciente en producción{% endfor %}"
      when: outdated_files | length > 0
      tags: report

    - name: "Registrar estadísticas"
      ansible.builtin.set_stats:
        data:
          task_key: "task_{{ comparison_config.task_id }}"
          task_info:
            description: "{{ comparison_summary.task_description }}"
            status: "{{ comparison_summary.status }}"
            total_source: "{{ comparison_summary.total_source_files | int }}"
            total_target: "{{ comparison_summary.total_target_files | int }}"
            missing: "{{ comparison_summary.missing_count | int }}"
            outdated: "{{ comparison_summary.outdated_count | int }}"
            identical: "{{ comparison_summary.identical_count | int }}"
        per_host: false
        aggregate: false
      tags: report
