---
# run_task_03.yml - Tarea 0.3 COMPLETA con configuración de shares
- name: "Tarea 0.3 Bizagi - Pre-configuración"
  hosts: servers_origen
  gather_facts: false

  vars:
    task_config:
      id: "0_3"
      description: "Crear carpeta compartida en contingencia"
      name_share: "Cont_Documentos"
      scripts_path: "D:\\Mis Documentos"
      cont_share: "\\\\{{ groups['servers_contingencia'][0] }}\\Cont_Documentos"

  pre_tasks:
    - name: "Recuperar Facts"
      ansible.builtin.setup:
      ignore_unreachable: true
      register: fact_result

    - name: "Establecer estado de los Facts"
      ansible.builtin.set_fact:
        facts_generated: true
      when: ansible_os_family is defined

  tasks:
    - name: "Crear carpeta compartida en contingencia"
      ansible.windows.win_share:
        name: "{{ task_config.name_share }}"
        path: "{{ task_config.scripts_path }}"
        list: false
        full: "Administrators"
        state: present
        description: "{{ task_config.name_share }}"
      register: share_creation
      when:
        - facts_generated is defined
      delegate_to: win2016_2017

- name: "Tarea 0.3 Bizagi - Inventario de Scripts"
  hosts: servers_origen
  gather_facts: false
  serial: 1

  vars:
    task_config:
      id: "0_3"
      description: "Sincronizar scripts Prod → Contingencia"
      scripts_path: "D:\\Mis Documentos"
      file_patterns: ["*.bat", "*.ps1"]

  pre_tasks:
    - name: "Recuperar Facts"
      ansible.builtin.setup:
      ignore_unreachable: true
      register: fact_result

    - name: "Establecer estado de los Facts"
      ansible.builtin.set_fact:
        facts_generated: true
      when: ansible_os_family is defined

    - name: "Crear resultado si es No alcanzable"
      when: facts_generated is not defined
      block:
        - name: "Registrar error de recolección de Facts"
          ansible.builtin.set_fact:
            file_operations_result:
              start_time: "{{ ansible_date_time.date | default('N/A') }} - {{ ansible_date_time.time | default('N/A') }}"
              task_id: "0_3"
              source_host: "{{ inventory_hostname }}"
              files_inventory: []
              status: "unreachable"

  tasks:
    - name: "Ejecutar Tarea 0.3 - File Operations Inventory"
      ansible.builtin.include_role:
        name: file_operations
      vars:
        file_operations_operation_type: "inventory"
        file_operations_source_path: "{{ task_config.scripts_path }}"
        file_operations_file_patterns: "{{ task_config.file_patterns }}"
        file_operations_task_id: "{{ task_config.id }}"
        file_operations_task_description: "{{ task_config.description }}"
        file_operations_show_details: true
      when: facts_generated is defined

    - name: "Mostrar resultado del inventario"
      ansible.builtin.debug:
        msg: |
          Tarea {{ file_operations_result.task_id }} completada:
          - Hora: {{ file_operations_result.start_time }}
          - Host: {{ file_operations_result.source_host }}
          - Status: {{ file_operations_result.status }}
          - Archivos: {{ file_operations_result.files_found }}

- name: "Tarea 0.3 - Análisis de Sincronización"
  hosts: localhost

  tasks:
    - name: "Recuperar Facts"
      ansible.builtin.setup:
        filter: ansible_date_time
      register: fact_result

    - name: "Generar plan de sincronización"
      ansible.builtin.set_fact:
        sync_plan: |
          {%- set prod_host = groups['servers_produccion'][0] -%}
          {%- set cont_host = groups['servers_contingencia'][0] -%}
          {%- set prod_files = hostvars[prod_host]['files_inventory'] | default([]) -%}
          {%- set cont_files = hostvars[cont_host]['files_inventory'] | default([]) -%}
          {%- set files_to_sync = [] -%}
          {%- set files_in_sync = [] -%}
          {%- set missing_in_cont = [] -%}
          {%- set cont_only_files = [] -%}

          {%- for prod_file in prod_files -%}
            {%- set cont_file = cont_files | selectattr('name', 'equalto', prod_file.name) | first | default(none) -%}
            {%- if cont_file -%}
              {%- if prod_file.lastwritetime > cont_file.lastwritetime or prod_file.hash != cont_file.hash -%}
                {%- set reason = 'newer' if prod_file.lastwritetime > cont_file.lastwritetime else 'different_content' -%}
                {%- set _ = files_to_sync.append({
                  'name': prod_file.name,
                  'reason': reason,
                  'prod_timestamp': prod_file.lastwritetime,
                  'cont_timestamp': cont_file.lastwritetime,
                  'prod_hash': prod_file.hash,
                  'cont_hash': cont_file.hash,
                  'size': prod_file.size
                }) -%}
              {%- else -%}
                {%- set _ = files_in_sync.append(prod_file.name) -%}
              {%- endif -%}
            {%- else -%}
              {%- set _ = missing_in_cont.append({
                'name': prod_file.name,
                'timestamp': prod_file.lastwritetime,
                'size': prod_file.size
              }) -%}
            {%- endif -%}
          {%- endfor -%}

          {%- for cont_file in cont_files -%}
            {%- if not (prod_files | selectattr('name', 'equalto', cont_file.name) | list) -%}
              {%- set _ = cont_only_files.append(cont_file.name) -%}
            {%- endif -%}
          {%- endfor -%}

          {{ {
            'prod_host': prod_host,
            'cont_host': cont_host,
            'files_to_sync': files_to_sync,
            'files_in_sync': files_in_sync,
            'missing_in_cont': missing_in_cont,
            'cont_only_files': cont_only_files,
            'prod_total': prod_files | length,
            'cont_total': cont_files | length,
            'sync_required': (files_to_sync | length > 0) or (missing_in_cont | length > 0)
          } }}

    - name: "REPORTE DE ANÁLISIS - TAREA 0.3"
      ansible.builtin.debug:
        msg: |
          ================================================================
                         ANÁLISIS DE SINCRONIZACIÓN - TAREA 0.3
                    Productivo (win2016sql) → Contingencia (win2016_2017)
          ================================================================
          Productivo: {{ sync_plan.prod_total }} archivos
          Contingencia: {{ sync_plan.cont_total }} archivos

          ARCHIVOS A ACTUALIZAR: {{ sync_plan.files_to_sync | length }}
          {% for file in sync_plan.files_to_sync %}
          - Archivo: {{ file.name }} ({{ file.reason }})
            Date Prod: {{ file.prod_timestamp }} | Date Cont: {{ file.cont_timestamp }}
          {% endfor %}

          ARCHIVOS FALTANTES EN CONTINGENCIA: {{ sync_plan.missing_in_cont | length }}
          {% for file in sync_plan.missing_in_cont %}
          - Archivo: {{ file.name }} ({{ file.size }} bytes)
          {% endfor %}

          ARCHIVOS SINCRONIZADOS: {{ sync_plan.files_in_sync | length }}
          {% for file in sync_plan.files_in_sync %}
          - Archivo: {{ file }}
          {% endfor %}

          ARCHIVOS SOLO EN CONTINGENCIA: {{ sync_plan.cont_only_files | length }}
          {% for file in sync_plan.cont_only_files %}
          - Archivo: {{ file }}
          {% endfor %}

          RECOMENDACIÓN: {% if sync_plan.sync_required %}🔄 EJECUTAR SINCRONIZACIÓN{% else %}✅ NO SE REQUIERE ACCIÓN{% endif %}
          ================================================================

    - name: "Registrar análisis en stats globales"
      ansible.builtin.set_stats:
        data:
          bizagi_task_0_3_analysis:
            analysis_timestamp: "{{ ansible_date_time.iso8601 }}"
            sync_required: "{{ sync_plan.sync_required }}"
            summary:
              files_to_update: "{{ sync_plan.files_to_sync | length }}"
              files_missing: "{{ sync_plan.missing_in_cont | length }}"
              files_in_sync: "{{ sync_plan.files_in_sync | length }}"
              cont_only_files: "{{ sync_plan.cont_only_files | length }}"
            sync_plan: "{{ sync_plan }}"
        per_host: false
